<title id="title">CCBaga architecture</title><desc id="desc">React talks to the native Rust core, which invokes platform APIs and exchanges token-scoped browser reports. The UI offers a separate Skill installation prompt; the user runs it in a local AI coding agent for approved SSH deployment to a VPS and residential SOCKS5 exit.</desc>
